# intervention.status -> символьное имя записи каталога waf_deny_response.
#
# Таблица маленькая и явная нарочно. Код ответа с провода модуль не принимает
# вовсе -- он берёт его из waf_deny_response, где 2xx и 3xx запрещены при
# загрузке конфигурации. Инспектору поэтому незачем уметь выражать больше, чем
# «какая из объявленных в nginx страниц отказа тут уместна».
#
# Имена должны существовать в конфигурации nginx: waf_deny_response blocked ...
# Присланное имя, которого в каталоге нет, модуль заменит на
# waf_deny_response_default.
#
# Разбирается плоское отображение "ключ: значение"; вложенности здесь нет и не
# предвидится, см. internal/verdict/statusmap.go.

403: blocked
406: blocked
400: malformed
default: blocked
