# Профиль allow -- фикстура: инспектор в наборе маршрута есть, правил не
# исполняется ни одного.
#
# Отличается от waf_inspector_mode ignore, и разница существенная: при ignore на
# шину не уходит ни одного сообщения, то есть не проверяется ни транспорт, ни
# ответ, ни то, что модуль закрыл волну. Здесь проверяется всё это, а не
# проверяется только детект. Заодно это готовый рубильник на маршрут: инспектор
# остаётся в наборе и продолжает отвечать, но по этому пути не смотрит ни на что.
#
# SecRuleEngine Off, а не пустой набор правил: пустой набор всё равно проходит
# фазы и разбирает тело по Content-Type. Здесь же нужна нулевая стоимость -- по
# этому профилю меряется накладной расход самого канала, отдельно от движка.

SecRuleEngine Off
