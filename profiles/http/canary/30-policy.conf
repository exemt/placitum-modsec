# Единственное правило профиля и вся его суть.
#
# Пороги выставляются здесь, а не приходят из crs-setup: CRS в этом профиле нет.
# Исходящий порог 4 -- тот же, что у штатных, чтобы калибровка score в
# internal/verdict считала по той же шкале.
SecAction "id:1000900,phase:1,nolog,pass,t:none,\
    setvar:tx.modsec_profile=canary,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# Канарейка в теле ответа. phase:4 -- не украшение: тело ответа существует
# только в ней. То же самое значение в заголовке ответа (фаза 3) или в запросе
# (фазы 1-2) этим правилом не найдётся, и это ровно то, что проверяет тест.
#
# pass, а не deny: блокирует модуль по порогу маршрута. Вес 5 при пороге 4 --
# одно срабатывание переводит порог, то есть маршрут с waf_score_deny response
# отказывает по одной канарейке.
SecRule RESPONSE_BODY "@rx WAF-CANARY-[0-9a-f]{8}" \
    "id:1000901,phase:4,log,pass,t:none,\
    msg:'canary leaked in the response body',\
    severity:'CRITICAL',\
    setvar:tx.blocking_outbound_anomaly_score=+5,\
    setvar:tx.outbound_anomaly_score=+5"
