# Профиль canary -- фикстура фазы 4, а не политика.
#
# Он отвечает на вопрос «а правила ответной стороны вообще исполняются?» так,
# чтобы ответ не зависел ни от версии CRS, ни от уровня паранойи, ни от того,
# что в наборе переименовали. CRS сюда не включается вовсе: единственное
# правило -- своё, ниже в 30-policy.conf.
#
# Отличие от фикстур allow и deny: те отвечают одинаково на любой запрос, а эта
# срабатывает ровно на одно содержимое и ровно в одной фазе. Тем она и полезна:
# если канарейка в теле ответа найдена, значит работает вся цепочка -- снимок
# тела фазы ответа, обменник, локатор, движок и фаза 4 в нём.

Include @coraza.conf-recommended

# Как у штатных профилей: порог применяет модуль по waf_score_deny своей фазы.
SecRuleEngine DetectionOnly

SecAuditEngine Off
SecAuditLog /dev/null
SecDebugLogLevel 0

# Тело запроса не читается: канарейку ищем в ответе, и разбор запроса здесь --
# лишняя работа на каждом сообщении.
SecRequestBodyAccess Off

# Ради чего профиль существует.
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimitAction ProcessPartial
