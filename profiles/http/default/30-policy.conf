# Локальная политика поверх CRS. Что этот профиль держит выключенным и почему
# -- см. «Профили правил» в README инспектора.

# Защита от DoS. Её работу делает локальный слой модуля -- waf_local_rate и
# инспектор адреса, -- и делает раньше: до публикации на шину. Оставить её здесь
# значило бы считать один и тот же флуд дважды, причём второй раз уже после
# того, как он создал сообщение на шине, то есть ровно после того, как обошёлся
# дорого.
#
# В поставке CRS 4 этих правил нет: 912 вынесен в отдельный плагин. Директива
# фиксирует политику на случай, когда набор обновят или плагин подключат.
SecRuleRemoveByTag "attack-dos"

# Persistent collections (initcol, SecDataDir) в этом профиле не отключаются
# директивой, потому что отключать нечего: ядро CRS 4 их не использует. Ставить
# их обратно нельзя -- состояние между запросами противоречит контракту
# инспектора: состояние живёт ровно один запрос и снимается вместе с ним.

# Собственный маркер профиля. Правило ничего не блокирует и ничего не добавляет
# к счёту; оно нужно, чтобы в audit было видно, какой набор реально применился,
# даже когда не сработало больше ничего.
SecAction "id:1000000,phase:1,nolog,pass,t:none,setvar:tx.modsec_profile=default"
