Include @crs-setup.conf.example

# Paranoia level 1: raise it only after looking at the score distribution on real traffic.
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=1"

# CRS thresholds are the denominators of the score calibration, not blocking thresholds: 5 CRS
# points give a score of 50, 10 give 100. The outbound threshold is lower: a leak costs more.
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
