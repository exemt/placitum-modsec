# Поставляемый набор CRS, не редактируется на месте: всё, что этот профиль
# меняет, лежит в 30-policy.conf поверх него.
#
# Включаются обе стороны. Транзакция живёт весь запрос: инспектор доигрывает
# фазы 3-4 поверх состояния фаз 1-2 того же экземпляра, а на откате (состояние
# потеряно, продолжение спросили у другого экземпляра) переигрывает фазы 1-2 по
# контексту запроса из сообщения. В обоих случаях набор нужен один и тот же:
# фазы 3-4 исполняются в той же транзакции, что и 1-2, и разделить их по двум
# наборам значило бы потерять между ними и инициализацию, и контекст.
#
# REQUEST-949-BLOCKING-EVALUATION и RESPONSE-959-BLOCKING-EVALUATION остаются:
# именно они сводят счёт по уровням паранойи в tx.blocking_*_anomaly_score,
# который инспектор читает и калибрует. Их финальный deny в DetectionOnly не
# срабатывает.
#
# RESPONSE-980-CORRELATION тоже остаётся, и это разница с прежней раскладкой:
# корреляция входящего счёта с исходящим требует обоих в одной транзакции, и
# теперь они в одной. Её правила -- фазы 5, в находки не попадают: инспектор
# отдаёт фазы 1-2 в вердикте запроса и 3-4 в вердикте ответа.

Include @owasp_crs/REQUEST-*.conf
Include @owasp_crs/RESPONSE-*.conf
