# Profile files are included in lexical order: engine, CRS setup, CRS, local policy.

Include @coraza.conf-recommended

# The module decides by the route threshold, so the engine only scores; the final CRS deny shows in
# the audit as crs_would_block.
SecRuleEngine DetectionOnly

SecAuditEngine Off
SecAuditLog /dev/null

SecDebugLogLevel 0

# One transaction covers the whole request: phases 3-4 run on top of phases 1-2.
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json

# The module already sends a prefix within waf_capture response body=; parse what arrived.
SecResponseBodyLimitAction ProcessPartial
