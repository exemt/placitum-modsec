# Отказ без условия: ни от пути, ни от заголовков, ни от тела он не зависит. Так
# и задумано -- по фикстуре, отвечающей по-разному на разные запросы, нельзя
# отличить "профиль применился" от "правило не сработало".

SecAction "id:1000000,phase:1,nolog,pass,t:none,setvar:tx.modsec_profile=deny"

# status:403 выбран не произвольно: по таблице status_map.yaml он превращается в
# имя blocked, и запись каталога waf_deny_response с таким именем в конфигурации
# окружения есть. Проверяемой оказывается вся цепочка -- вмешательство движка,
# таблица имён, каталог отказов, -- а не только то, что инспектор сказал deny.
#
# msg попадает в находку события аудита, но не в ответ модулю и не в заголовок
# ответа клиенту: текст правила
# несёт фрагмент пользовательского ввода, и клиенту его видеть незачем, см.
# internal/verdict.
SecAction "id:1000900,phase:1,log,t:none,deny,status:403,msg:'modsec fixture: unconditional deny'"
