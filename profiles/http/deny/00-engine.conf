# Профиль deny -- фикстура, а не политика: движок блокирует сам, безусловно и на
# каждом запросе.
#
# Единственный профиль, где SecRuleEngine On. У штатных он DetectionOnly, и это
# принципиально: порог по счёту -- дело модуля, а не набора правил. Здесь
# наоборот, и нужно это затем, что ветка "движок вернул вмешательство" в
# internal/verdict на живом трафике не встречается вовсе -- ни разу, ни на каком
# запросе, -- а отвечает она за перевод status движка в имя записи каталога
# waf_deny_response. Непроверяемой такая ветка остаётся до первого профиля,
# который включил блокировку у себя, то есть до этого.
#
# CRS сюда не включается. Фикстура обязана давать один и тот же ответ при любом
# обновлении набора правил, а её собственное правило -- ниже, в 30-policy.conf.

SecRuleEngine On

# Как и у остальных профилей: свой аудит уходит в JetStream, второй источник
# правды на диске не нужен.
SecAuditEngine Off
SecAuditLog /dev/null

SecDebugLogLevel 0
SecResponseBodyAccess Off
