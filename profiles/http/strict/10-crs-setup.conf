# Здесь и только здесь strict расходится с default.
#
# Уровень паранойи выставляется до включения самого CRS: правила читают
# tx.blocking_paranoia_level в той же фазе 1, в порядке объявления, и значение,
# назначенное после них, до них уже не дойдёт. Отсюда и номер файла: 10 идёт
# перед 20-crs.conf.

Include @crs-setup.conf.example

# Уровень 2 добавляет правила, которые на реальном трафике дают заметную долю
# ложных срабатываний. Он уместен там, где формат запросов узкий и известен --
# API, админка, -- и назначается маршруту профилем, а не всему инспектору.
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=2"

# Пороги те же: они знаменатели калибровки, а не пороги блокировки, и менять их
# вместе с уровнем паранойи значило бы одновременно двигать и шкалу, и то, что
# по ней измеряется.
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
